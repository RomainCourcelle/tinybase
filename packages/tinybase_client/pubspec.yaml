name: tinybase_client
description: >
  Flutter/Dart SDK for the TinyBase backend — email/OAuth auth, automatic JWT
  refresh, and generic collection CRUD. Not affiliated with the JavaScript
  TinyBase library (tinybase.org).
version: 0.1.0
homepage: https://github.com/RomainCourcelle/tinybase
repository: https://github.com/RomainCourcelle/tinybase
issue_tracker: https://github.com/RomainCourcelle/tinybase/issues
documentation: https://github.com/RomainCourcelle/tinybase/tree/main/packages/tinybase_client

topics:
  - flutter
  - backend
  - auth
  - rest
  - jwt

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
