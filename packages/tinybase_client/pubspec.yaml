name: tinybase_client
description: >-
  Flutter SDK for the TinyBase backend: auth, JWT refresh, collection CRUD,
  file uploads, and realtime SSE.
version: 0.3.2
homepage: https://github.com/RomainCourcelle/tinybase
repository: https://github.com/RomainCourcelle/tinybase
issue_tracker: https://github.com/RomainCourcelle/tinybase/issues
documentation: https://tinybase-documentation.up.railway.app/

topics:
  - flutter
  - backend
  - auth
  - rest
  - jwt

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
