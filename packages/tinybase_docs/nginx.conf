server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Entrypoints Flutter Web : jamais de cache long, sinon un redeploy
  # laisse les navigateurs / CDN sur l'ancien main.dart.js pendant des jours.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
  }

  location = /main.dart.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets hashés / images : cache OK
  location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
