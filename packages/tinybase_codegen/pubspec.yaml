name: tinybase_codegen
description: >
  Génère, à partir d'une CollectionDefinition (tinybase_shared), le modèle
  Dart + repository + couche state (Provider/ChangeNotifier ou Riverpod
  annotations) d'une collection TinyBase. Utilisé par la route API
  GET /api/admin/collections/:name/codegen?style=provider|riverpod.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  tinybase_shared:
    path: ../tinybase_shared

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.8

# Tests unitaires des générateurs : packages/tinybase_codegen/test/
