name: tinybase_codegen
description: >
  Génère, à partir d'une CollectionDefinition (tinybase_shared), le modèle
  Dart + repository + provider (pattern Provider/ChangeNotifier) d'une
  collection TinyBase. Utilisé par la route API
  POST /api/admin/collections/:name/codegen (tinybase_server), pour que
  nexus_code_launcher puisse générer ces fichiers directement pendant le
  scaffolding d'un projet.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  tinybase_shared:
    path: ../tinybase_shared

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.8
